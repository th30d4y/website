<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container h1 {
      font-size: 64px;
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    .container p {
      font-size: 18px;
      color: #aaa;
    }

    .dots {
      margin-top: 25px;
      font-size: 30px;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>COMING SOON</h1>
    <p>Something awesome is on the way.</p>
    <div class="dots">•••</div>
  </div>

</body>
</html>
